<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 600, 'GRAD' 0, 'opsz' 28;
      display: inline-block;
      vertical-align: middle;
      line-height: 1;
    }

    /* Tactile Guidance Dynamic Motion */
    @keyframes dashFlow {
      from {
        stroke-dashoffset: 72;
      }
      to {
        stroke-dashoffset: 0;
      }
    }

    @keyframes sensoryPulse {
      0% {
        r: 10px;
        opacity: 0.85;
        stroke-width: 3.5px;
      }
      60% {
        opacity: 0.4;
      }
      100% {
        r: 44px;
        opacity: 0;
        stroke-width: 1px;
      }
    }

    @keyframes beaconBreathe {
      0%, 100% {
        transform: scale(1);
        filter: drop-shadow(0 0 10px rgba(29, 78, 216, 0.7));
      }
      50% {
        transform: scale(1.15);
        filter: drop-shadow(0 0 18px rgba(56, 189, 248, 0.95));
      }
    }

    @keyframes audioRipples {
      0% {
        transform: scale(1);
        opacity: 0.6;
      }
      100% {
        transform: scale(1.65);
        opacity: 0;
      }
    }

    .animate-dash-flow {
      animation: dashFlow 1.4s linear infinite;
    }

    .pulse-ring-1 {
      animation: sensoryPulse 2.4s cubic-bezier(0.15, 0.85, 0.35, 1) infinite;
      transform-origin: 195px 540px;
    }
    
    .pulse-ring-2 {
      animation: sensoryPulse 2.4s cubic-bezier(0.15, 0.85, 0.35, 1) infinite;
      animation-delay: 0.8s;
      transform-origin: 195px 540px;
    }

    .pulse-ring-3 {
      animation: sensoryPulse 2.4s cubic-bezier(0.15, 0.85, 0.35, 1) infinite;
      animation-delay: 1.6s;
      transform-origin: 195px 540px;
    }

    .beacon-glow {
      animation: beaconBreathe 2s ease-in-out infinite;
      transform-origin: 195px 540px;
    }

    .mic-ripple {
      animation: audioRipples 2s ease-out infinite;
    }

    /* Accessibility high visibility focus */
    button:focus-visible, a:focus-visible {
      outline: 3px solid #1D4ED8 !important;
      outline-offset: 2px !important;
    }
  </style>
</head>
<body class="bg-surface text-on-surface antialiased overflow-hidden select-none touch-manipulation font-body-md text-body-md min-h-screen">
<!-- Mobile Viewport Container (390px baseline) -->
<div class="relative w-full max-w-md h-screen mx-auto overflow-hidden flex flex-col justify-between bg-surface-container-low shadow-2xl">
<!-- 1. FULL VIEWPORT MINIMALIST MAP & SENSORY ROUTE CANVAS -->
<div aria-hidden="true" class="absolute inset-0 z-0 bg-[#F4F6F9]">
<svg class="w-full h-full" fill="none" viewBox="0 0 390 844" xmlns="http://www.w3.org/2000/svg">
<defs>
<!-- Soft tactile patterns & gradients -->
<pattern height="16" id="guidingTiles" patternUnits="userSpaceOnUse" width="16">
<line stroke="#FFE083" stroke-dasharray="3 3" stroke-width="2.5" x1="0" x2="16" y1="8" y2="8"></line>
</pattern>
<linearGradient id="routeGlow" x1="0%" x2="0%" y1="100%" y2="0%">
<stop offset="0%" stop-color="#1D4ED8"></stop>
<stop offset="60%" stop-color="#0284C7"></stop>
<stop offset="100%" stop-color="#38BDF8"></stop>
</linearGradient>
<filter height="140%" id="neonBlur" width="140%" x="-20%" y="-20%">
<feGaussianBlur result="glow" stdDeviation="5"></feGaussianBlur>
<feComposite in="SourceGraphic" in2="glow" operator="over"></feComposite>
</filter>
</defs>
<!-- Minimalist Cartographic Roads (Base Gray Geometry) -->
<rect fill="#F8FAFC" height="844" width="390"></rect>
<!-- Soft Secondary Pedestrian Plazas -->
<path d="M-20 280 H420 V360 H-20 Z" fill="#EEF2F6"></path>
<path d="M120 -20 V860 H270 V-20 Z" fill="#EEF2F6"></path>
<path d="M-20 620 H420 V690 H-20 Z" fill="#F1F5F9"></path>
<!-- Tactile Guiding Block Walkways (Kuning Indikator Jalur Pemandu) -->
<!-- Main route tactile lane -->
<path d="M195 720 L195 320 Q195 305 210 305 L320 305" opacity="0.65" stroke="#FDE047" stroke-linecap="round" stroke-linejoin="round" stroke-width="12"></path>
<path d="M195 720 L195 320 Q195 305 210 305 L320 305" opacity="0.75" stroke="#CA8A04" stroke-dasharray="4 4" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
<!-- Sensory Sonar Radar Rings (White Cane / Ultrasonic Beacon Echo) -->
<circle class="pulse-ring-1" cx="195" cy="540" fill="none" r="10" stroke="#0284C7"></circle>
<circle class="pulse-ring-2" cx="195" cy="540" fill="none" r="10" stroke="#1D4ED8"></circle>
<circle class="pulse-ring-3" cx="195" cy="540" fill="none" r="10" stroke="#38BDF8"></circle>
<!-- Dynamic Animated High-Contrast Active Navigation Route -->
<!-- Neon route ambient back-glow -->
<path d="M195 540 L195 320 Q195 305 210 305 L320 305" filter="url(#neonBlur)" opacity="0.45" stroke="url(#routeGlow)" stroke-linecap="round" stroke-linejoin="round" stroke-width="14"></path>
<!-- Main solid tactile core path -->
<path d="M195 540 L195 320 Q195 305 210 305 L320 305" stroke="#0037B0" stroke-linecap="round" stroke-linejoin="round" stroke-width="8"></path>
<!-- Flowing Dash pulses (tactile feedback pulses moving forward) -->
<path class="animate-dash-flow" d="M195 540 L195 320 Q195 305 210 305 L320 305" stroke="#38BDF8" stroke-dasharray="14 10" stroke-linecap="round" stroke-linejoin="round" stroke-width="5"></path>
<!-- Turn Waypoint Target Node -->
<circle cx="210" cy="305" fill="#FFFFFF" r="9" stroke="#0037B0" stroke-width="4"></circle>
<circle cx="210" cy="305" fill="#0037B0" r="3.5"></circle>
<!-- Destination Node with subtle ripple -->
<circle cx="320" cy="305" fill="#DBEAFE" opacity="0.7" r="14"></circle>
<circle cx="320" cy="305" fill="#1D4ED8" r="9" stroke="#FFFFFF" stroke-width="3"></circle>
<circle cx="320" cy="305" fill="#FFFFFF" r="3.5"></circle>
<!-- User Sensor Beacon (Representing Visually Impaired User with Cane/Radar) -->
<g class="beacon-glow">
<circle cx="195" cy="540" fill="#FFFFFF" r="14" stroke="#1D4ED8" stroke-width="4"></circle>
<circle cx="195" cy="540" fill="#1D4ED8" r="6"></circle>
</g>
</svg>
</div>
<!-- 2. TOP APP BAR & BRAND ANCHOR -->

<!-- 4. FLOATING VOICE ASSISTANT FAB (Mic with ripple wave) -->

<span class="material-symbols-outlined text-[32px]" data-icon="mic" style="font-variation-settings: 'FILL' 1;">mic</span>
</button>

<!-- 5. BOTTOM FLOATING TRIP COMPACT HUD & CONTROLS -->
<div class="relative z-20 px-5 pb-24 space-y-3">
<!-- Primary Status Card: Time, Distance, and Sound Action -->
<div class="w-full bg-surface-container-lowest rounded-lg p-5 shadow-[0_12px_28px_rgba(17,24,39,0.12),0_2px_4px_rgba(17,24,39,0.04)]">
<!-- Metrics Row -->
<div class="flex items-center justify-between border-b border-surface-container pb-4">
<div>
<div class="flex items-baseline gap-2">
<span class="text-headline-lg-mobile font-headline-lg-mobile text-on-background font-extrabold">8 Menit</span>
<span class="text-headline-sm font-headline-sm text-outline font-semibold">• 420m</span>
</div>
<p class="text-body-md font-body-md text-on-surface-variant font-medium mt-0.5">

<button aria-label="Beralih ke getar taktil" class="min-h-[52px] min-w-[52px] px-3.5 py-2.5 rounded-full bg-primary-container text-on-primary flex items-center gap-1.5 shadow-sm active:scale-95 transition-transform" type="button">
<span class="material-symbols-outlined text-[22px]" data-icon="vibration">vibration</span>
<span class="text-label-md font-label-md">Haptik</span>
</button>
</div>
<!-- Emergency & Quick Reroute Actions (Strictly >52px height) -->
<div class="pt-4 grid grid-cols-2 gap-3">
<button class="min-h-[52px] w-full rounded-full bg-surface-container text-primary font-bold flex items-center justify-center gap-2 hover:bg-surface-container-high transition-colors active:scale-95 focus:outline focus:outline-[3px] focus:outline-primary" type="button">
<span class="material-symbols-outlined text-[24px]" data-icon="alt_route">alt_route</span>

</button>
</div>
</div>
</div>
<!-- 6. BOTTOM NAVIGATION BAR (Anchored from Shared Components JSON) -->
<!-- Destination count: 3 | Labels: ["Navigasi", "Rute", "Suara"] | Icons: ["explore", "alt_route", "volume_up"] -->
<!-- Current Page: Active Navigation -> "Navigasi" is active -->
<nav aria-label="Menu Utama Navigasi" class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 py-3 max-w-md mx-auto bg-surface-container-lowest shadow-[0_-4px_16px_rgba(17,24,39,0.08)]">
<!-- Tab 1: Navigasi (ACTIVE: using style_active_navigation) -->

<span class="material-symbols-outlined text-[24px]" data-icon="explore" style="font-variation-settings: 'FILL' 1;">explore</span>

</a>
<!-- Tab 2: Rute (INACTIVE: using style_inactive_navigation) -->

<!-- Tab 3: Suara (INACTIVE: using style_inactive_navigation) -->

<span class="material-symbols-outlined text-[24px]" data-icon="volume_up">volume_up</span>
<span class="text-label-lg font-label-lg">Suara</span>
</a>
</nav>
</div>
<!-- Inline Interaction Logic (Audio feedback simulation for visually impaired users) -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
      // Announce turn cue to screen reader users or simulated TTS
      const announceBtn = document.querySelector('button[aria-label="Ulangi instruksi suara"]');
      if (announceBtn) {
        announceBtn.addEventListener('click', () => {
          if ('speechSynthesis' in window) {
            const utterance = new SpeechSynthesisUtterance('Belok Kanan dalam 45 meter. Mengikuti jalur guiding block aman.');
            utterance.lang = 'id-ID';
            window.speechSynthesis.speak(utterance);
          }
        });
      }
    });
  </script>
